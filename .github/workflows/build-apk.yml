
name: Build CallSignal APK

on:
  workflow_dispatch:
  push:
    paths:
      - "CallSignalReader-Android-Studio-Project_12.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          unzip -o CallSignalReader-Android-Studio-Project_12.zip -d extracted
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Fix missing launcher icons
        run: |
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          sed -i \
            -e 's|@mipmap/ic_launcher_round|@android:drawable/sym_call_incoming|g' \
            -e 's|@mipmap/ic_launcher|@android:drawable/sym_call_incoming|g' \
            "$MANIFEST"

      - name: Set up Gradle wrapper
        run: |
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CallSignalReader-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
